name: verify

# main auto-deploys to Vercel, so this is the last gate before production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repo. Fork PRs already get a read-only token, but
# stating it means a future workflow edit cannot silently inherit write scope.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No secrets needed: the suite stubs Supabase (src/test/supabase-stub.ts)
      # and never reads .env.local.
      - run: pnpm verify

      # Fails the build on a high-severity advisory in the production tree.
      # Scoped to --prod: a dev-only advisory should not block a deploy, and
      # the full report stays available via `pnpm audit` locally.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
