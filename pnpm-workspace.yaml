# Transitive dependencies of `next` that carry advisories Next has not yet
# bumped past. postcss: arbitrary file read + path traversal via
# sourceMappingURL. sharp: inherited libvips CVEs. Both are patch/minor bumps
# within the same major, so the APIs Next relies on are unchanged.
overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
  # GHSA-mh99-v99m-4gvg: DoS via unbounded brace expansion. Reached only
  # through @sentry/nextjs's build-time plugins (bundler-plugin-core /
  # webpack-plugin -> glob -> minimatch@10), so it never runs at request time --
  # but `pnpm audit --prod` cannot distinguish, and the CI gate is not worth
  # weakening for it.
  #
  # Scoped to the 5.x line deliberately. An unscoped `brace-expansion` override
  # also drags eslint's minimatch@3 -> brace-expansion@1.1.16 up to 5.x, which
  # is a breaking major for that consumer and makes `pnpm lint` exit 2.
  brace-expansion@5: '>=5.0.8'
allowBuilds:
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  esbuild: true
  # Downloads the sentry-cli binary, which withSentryConfig uses to upload
  # source maps at build time. Without it, production stack traces stay
  # minified and unreadable.
  '@sentry/cli': true
minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - next@16.2.12
  - '@next/eslint-plugin-next@16.2.12'
  - eslint-config-next@16.2.12
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@tailwindcss/oxide'
  - esbuild
  - '@sentry/cli'
