# Transitive dependencies of `next` that carry advisories Next has not yet
# bumped past. postcss: arbitrary file read + path traversal via
# sourceMappingURL. sharp: inherited libvips CVEs. Both are patch/minor bumps
# within the same major, so the APIs Next relies on are unchanged.
overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
allowBuilds:
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - next@16.2.12
  - '@next/eslint-plugin-next@16.2.12'
  - eslint-config-next@16.2.12
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@tailwindcss/oxide'
  - esbuild
